# nginx-Site für den Satisfactory-sync-Server (Plan 5.5).
# Ziel: /etc/nginx/sites-available/sync.v3in.de (+ Symlink in sites-enabled), installiert von
# deploy/nginx-install.sh. Betrifft NUR den Hostnamen sync.v3in.de – andere Sites bleiben unberührt.
#
# Zunächst nur Port 80. `certbot --nginx -d sync.v3in.de` ergänzt danach den 443-Block mit Zertifikat
# und die Weiterleitung von HTTP auf HTTPS in genau dieser Datei.

server {
    listen 80;
    listen [::]:80;
    server_name sync.v3in.de;

    access_log /var/log/nginx/sync.v3in.de.access.log;
    error_log  /var/log/nginx/sync.v3in.de.error.log;

    # Spielstände bis ~512 MB (Sync:MaxUploadBytes) plus Reserve.
    client_max_body_size 600m;

    # Uploads direkt an den Server durchreichen, nicht erst auf Platte puffern
    # (der Server prüft Größe/Hash selbst und lehnt früh ab).
    proxy_request_buffering off;
    proxy_http_version 1.1;

    # Große Uploads/Downloads über langsame Leitungen.
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;
    client_body_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:3160;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Downloads (Range-Support im Server) nicht in nginx zwischenspeichern.
        proxy_buffering off;
    }
}
