# CI: Server (.NET 10) und Launcher (Electron/TypeScript) bauen, prüfen, testen (Plan 11).
# Jeder Job läuft nur, wenn sich sein Teil (oder dieser Workflow) geändert hat.
name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Geänderte Teile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      launcher: ${{ steps.filter.outputs.launcher }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            launcher:
              - 'launcher/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'

  server:
    name: Server (.NET 10)
    needs: changes
    # Manuell gestartet: immer alles prüfen.
    if: needs.changes.outputs.server == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Ohne packages.lock.json: Schlüssel aus Projektdateien.
      - name: NuGet-Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/**/*.csproj', 'server/**/*.props', 'server/**/*.targets', 'server/**/*.slnx', 'server/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore SatisfactorySync.slnx

      - name: Format prüfen
        run: dotnet format SatisfactorySync.slnx --verify-no-changes --no-restore

      - name: Build (Warnungen = Fehler)
        run: dotnet build SatisfactorySync.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test SatisfactorySync.slnx --configuration Release --no-build

  launcher:
    name: Launcher (Electron)
    needs: changes
    if: needs.changes.outputs.launcher == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: launcher
    env:
      # Typecheck, Lint, Tests und Vite-Build brauchen die Electron-Binary nicht.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Abhängigkeiten
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format prüfen
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
